<script>

var ERRS = [];

function errClock(){
  var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  var ms = d.getMilliseconds(), m3 = (ms < 10 ? '00' : (ms < 100 ? '0' : '')) + ms;
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + m3;
}

var ERR_SEEN = {};
function errOnce(key, m){
  if (ERR_SEEN[key]) return;
  ERR_SEEN[key] = 1;
  errNote(m, 0);
}

var CLOCKRE = /^\d\d:\d\d:\d\d[.\d]*  /;

function logNote(s){
  var t = String(s || '');
  if (t.length > 160) t = t.slice(0, 160);
  if (ERRS.length){
    var prev = ERRS[ERRS.length - 1];

    var body = prev.replace(CLOCKRE, '').replace(/ ×\d+$/, '');
    if (body === t){
      var n = /×(\d+)$/.exec(prev);
      ERRS[ERRS.length - 1] = prev.replace(/ ×\d+$/, '') + ' ×' + ((n ? parseInt(n[1], 10) : 1) + 1);
      return;
    }
  }
  ERRS.push(errClock() + '  ' + t);
  if (ERRS.length > 200) ERRS.shift();
}

function logT(key, a, b){
  var ru = (typeof LOG_RU === 'object' && LOG_RU) ? LOG_RU : null;
  var s = (ru && ru[key]) || (typeof LOG_EN === 'object' && LOG_EN[key]) || key;
  if (a !== undefined && a !== null)
    s = s.replace('{a}', (a && a.message) ? a.message : String(a));
  if (b !== undefined && b !== null)
    s = s.replace('{b}', (b && b.message) ? b.message : String(b));
  return s;
}

function errNote(m, ln){
  var t = String(m || 'ошибка');
  if (ln) t += ' :' + ln;

  logNote('! ' + t);
}

var PERFN = 100;
var PERFLIM = 16;

function perfBucket(){ return { i: 0, n: 0, buf: [], worst: 0, over: 0, all: 0 }; }
var PERF = { paint: perfBucket(), photo: perfBucket(),
             tail: perfBucket(), stack: perfBucket() };

function perfNow(){
  return (typeof performance !== 'undefined' && performance && performance.now)
    ? performance.now() : Date.now();
}

function perfAdd(b, ms){
  if (!b || !(ms >= 0)) return;
  b.buf[b.i] = ms;
  b.i = (b.i + 1) % PERFN;
  if (b.n < PERFN) b.n++;
  if (ms > b.worst) b.worst = ms;

  b.all++;
  if (ms > PERFLIM) b.over++;
}

function perfAvg(b){
  if (!b || !b.n) return 0;
  var s = 0;
  for (var i = 0; i < b.n; i++) s += b.buf[i];
  return s / b.n;
}

function perfWatch(name, ms){
  if (ms <= PERFLIM) return;
  if (typeof logNote === 'function') logNote('отклик: ' + name + ' выше порога');
}

function perfLine(){
  var f = function(b){
    var pc = b.all ? Math.round(b.over * 100 / b.all) : 0;
    return perfAvg(b).toFixed(1) + '/' + b.worst.toFixed(1) + '/' + pc + '%';
  };
  return 'paint ' + f(PERF.paint) + '   photo ' + f(PERF.photo) +
         '   tail ' + f(PERF.tail) + '   stack ' + f(PERF.stack) +
         '   ms avg/worst/over ' + PERFLIM;
}

if (typeof window !== 'undefined'){
  window.onerror = function(m, src, ln){ errNote(m, ln); return false; };
  window.addEventListener('unhandledrejection', function(e){
    errNote(e && e.reason ? (e.reason.message || e.reason) : 'обещание отвергнуто', 0);
  });
}

function deskOf(theme){
  var t = THEMES[theme] || THEMES.black;
  return (typeof t.desk === 'number') ? t.desk : 0;
}

function accOf(theme){
  var t = THEMES[theme] || THEMES.black;
  return t.acc || 'none';
}

function iconsOnly(){ return cfg.lang === 'icons'; }

function langNow(){

  if (cfg.lang !== 'auto') return L[cfg.lang] ? cfg.lang : 'en';

}

function T(k){
  var d = L[langNow()] || L.en;
  if (d[k] !== undefined) return d[k];
  if (L.en[k] !== undefined) return L.en[k];
  return (L.ru[k] !== undefined) ? L.ru[k] : k;
}

function TA(k){
  var d = A[langNow()] || A.en;
  return (d[k] !== undefined) ? d[k] : A.en[k];
}

function loadCfg(){
  cfg.desk = deskOf(cfg.theme);
  try {
    var s = localStorage.getItem('jot.cfg');
    if (!s) return;
    var o = JSON.parse(s);
    if (o && (o.lang === 'auto' || L[o.lang])) cfg.lang = o.lang;
    if (o && o.fmt) cfg.fmt = o.fmt;

    if (o && o.theme === 'coal') o.theme = 'jot';
    if (o && THEMES[o.theme]) cfg.theme = o.theme;

    if (o && o.accent === 'blue') o.accent = 'teal';
    if (o && (o.accent === 'none' || ACCENTS[o.accent])) cfg.accent = o.accent;
    if (o && (o.fb === 'off' || o.fb === 'snd')) cfg.fb = o.fb;
    if (o && (o.hv === 'once' || o.hv === 'always')) cfg.hv = o.hv;
    if (o && (o.lite === 0 || o.lite === 1)) cfg.lite = o.lite;
    if (o && o.saidCopy) cfg.saidCopy = 1;
    if (o && o.prefix) cfg.prefix = o.prefix;
    if (o && o.duoDark) cfg.duoDark = o.duoDark;
    if (o && o.duoLite) cfg.duoLite = o.duoLite;

    cfg.desk = deskOf(cfg.theme);
    if (o && typeof o.desk === 'number' && o.desk >= 0 && o.desk <= 100)
      cfg.desk = Math.round(o.desk);
  } catch(e){

    errOnce('cfgRead', 'настройки не прочитались: ' + (e && e.message ? e.message : e));
  }
}

function saveCfg(){
  try {
    localStorage.setItem('jot.cfg', JSON.stringify({lang:cfg.lang, fmt:cfg.fmt, theme:cfg.theme, accent:cfg.accent, prefix:cfg.prefix, fb:cfg.fb, lite:cfg.lite, desk:cfg.desk, stkSeed:cfg.stkSeed, hv:cfg.hv, saidCopy:cfg.saidCopy, duoDark:cfg.duoDark, duoLite:cfg.duoLite, dbg:cfg.dbg}));
  } catch(e){

    errOnce('cfgWrite', 'настройки не сохранились: ' + (e && e.message ? e.message : e));
  }
}

function resetCfg(){
  try { localStorage.removeItem('jot.cfg'); }
  catch(e){

    errOnce('cfgWipe', 'сброс настроек не дошёл до хранилища: ' + (e && e.message ? e.message : e));
  }
  cfg.lang = DEF.lang; cfg.fmt = DEF.fmt; cfg.theme = DEF.theme;
  cfg.prefix = DEF.prefix; cfg.fb = DEF.fb; cfg.lite = DEF.lite;
  cfg.desk = deskOf(cfg.theme);
  cfg.accent = accOf(cfg.theme);
}

function srcBase(){
  var n = '';
  try { if (typeof BR !== 'undefined' && BR && BR.srcName) n = BR.srcName() || ''; }
  catch(e){  }
  n = String(n).replace(/\.[^.]*$/, '');
  n = n.replace(/_\d{2}-\d{2}-\d{4}_\d{2}-\d{2}-\d{2}$/, '');
  n = n.replace(/[\\\/:*?"<>|\n\r\t]/g, '').trim();
  return n.slice(0, 60);
}

function stamp(base){
  var d = new Date();
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  var day = p(d.getDate()) + '-' + p(d.getMonth()+1) + '-' + d.getFullYear();
  var time = p(d.getHours()) + '-' + p(d.getMinutes()) + '-' + p(d.getSeconds());
  return ((base && base.length) ? base : (cfg.prefix || 'jot')) + '_' + day + '_' + time;
}

function keepPrefix(name){
  var s = String(name || '').split('_')[0].trim();
  if (s.length && s.length < 40 && s !== cfg.prefix){
    cfg.prefix = s;
    saveCfg();
  }
}

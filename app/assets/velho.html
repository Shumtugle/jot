  screens: [
    ['Home', 'Three rows of four, and they are ordered by what they touch. The light row comes first: fix, zoom, a cell kept for a light tool not yet built, and geometry. These do not open a panel at all — the row turns into a track in place, the sheet is not refitted, and the picture stays where your eye left it. Then what you do to the whole picture: adjust, draw, text, filter. Then what you do to a part of it: insert, cut out, crop, sheet. Sheet is where the backdrop, spin, mirror, tilt and the exported size live, five rows of them. Margins are switched off from the third of September and stay off: drawing paper around a picture is not part of editing it any more. The house in the top row returns to the editor from any screen, closing everything that is open. The Jot sign in the corner does one thing: it opens the settings. Help lives there too from the third of September, a cell in the row under the accent colours together with reset, restart and voice — everything the hand reaches for; the row below it belongs to the taking-apart instead. A light tool taken renames its own cell: while it is open the cell says more, because more is both the way back to the home screen and the word for done, and the name of a tool tells you nothing while that tool is already in your hands. It is the same first cell that every panel carries, only arrived at from the other side. The last row carries a camera cell from the second of September, in the place the insert screen left empty. It works from the third of September. No file provider was needed after all: the address is handed out in advance through the picture store — a row goes into the shared table of images, the address comes back, and the camera is given it as the place to write. The cell opens a screen with three cameras rather than the camera itself: to the editor, insert, to the pack. Each of them opens the camera knowing where the shot is going, so the choice is made before the shot rather than after it — you already know why you raised the phone, and a question asked afterwards is one you have answered with your feet. Whichever of the three you pick, the camera screen closes itself and the shot arrives on the screen it belongs to: insert opens montage, to the pack opens the pack, to the editor comes back to the picture. Until the third of September only the editor left that screen, and it left it by accident — the page reloads on that road and took the screen with it. An inserted shot arrives at the same size as one picked from the gallery, because both go through one door: forty parts in a hundred of the width of the frame, and the height follows the shape of what you inserted. Whichever of the three you pick, the original goes into the Jot folder first, byte for byte, and only then does the shot go where you sent it. It used to be only the editor that kept a copy; a rule that holds for all three is worth more than an exception, because a hand should not have to remember which cell looks after the photograph. Nor does a full original survive elsewhere on the other two roads: an inserted shot lives inside a sheet that is not its own, and one sent to the pack is squeezed to 512 points along its longer side. Nothing is transplanted and nothing is understood: date, camera, exposure, ISO, orientation and coordinates survive because the file is a copy rather than a rebuild. What you save after editing carries none of that, and rightly so — it is no longer that photograph. You end up with two: the original with everything, and the edited one without. Open the page in a browser rather than the app and the button says so instead of going quiet, because there is no shell there to take the shot. This is the first code in Jot that ships without the bench having read it: the bench reads the markup and the page code and does not run the shell at all. The last cell of the light row is history, added on the third of September, and with it the home screen is finished. It opens one notch to the left of the end, so the first thing you see is the step back rather than the picture you were already looking at, and the handle has room to travel both ways. The right end of the track is where the work stands as you left it; each notch further left is what the sheet was before one more edit. Leave the tool without having touched the handle and the work comes back to the end by itself, silently: opening a tool must not choose anything. Move the handle yourself and the choice is yours, so stopping to the left and walking away leaves it there. With nothing on the stack there is no step back to open at, and the tool opens at the end. Drag back and forth as much as you like — nothing is decided while you look. The moment you edit again, everything to the right of where you stopped leaves the stack, which is what makes it a way of choosing rather than a way of looking. Cutting happens at that first edit rather than when you let go of the track or leave the tool, because letting go is not a decision: you may still be looking, and you may well want to go off and see the whole picture before you make up your mind.'],
    ['Caption', 'The button puts a caption on the picture and opens its screen at once — the editor is the screen. The keyboard does not come with it: it takes two thirds of a phone, and you have come to see where the caption landed. Touch the field and it arrives. Text, colour, size, opacity, rounding, rotation, delete, and new for another one. A caption can be a label, a plate or a balloon; a balloon has a tail that points at a spot. One button in the bottom row carries the kind it is now and leads round on each tap: label, plate, balloon, label again. There is no step back round the ring, only the next step. While the screen is open a caption is taken by a tap and dragged by a finger, and one carried past the edge of the sheet stays visible, dimmed, so it is plain that this part will not reach the file. A caption left without a single character is thrown away.\n\nThe main screen edits nothing at all: it shows the result and hands out the tool sets. Every kind of object is edited on the screen it was born on. The cell that opens this screen is called text with a plus, and wears the mark that belonged to a light tool of that name until the first of September. That tool never did anything: it stood beside this one promising a second way to put letters on a picture, and two cells about letters, one of them empty, were worse than one cell carrying the better name. The place it held is still in the light row, unnamed and dashed, and it says so when touched. A new caption, label or mark appears a little below the middle of what you can see and a little to the left of it, so that its tail runs up and to the right, where the thing you are pointing at usually is. Until the third of September it appeared at the very bottom edge instead: the place was taken from the middle of the screen rather than the middle of the picture, and a landscape photograph on an upright phone leaves the middle of the screen below the picture entirely.'],
    ['Drawing', 'Twelve tools folded into four buttons: eraser, freehand brush, marker and shapes. Select moved down to the bottom row, beside more and the bin: it is not a tool but a way of holding your hand. The screen opens with it, not with a brush: nothing is armed when you arrive, so you can set the picture up without laying a stray line on it. Take a tool and it draws; leave and come back and nothing is armed again, though the tool you had is remembered and comes back with one tap. One colour sits in the row above it: tap it, then tap the colour on the photograph that should stay, and everything else goes grey; the tolerance slider appears with it. The button stays lit while a colour is held, and tapping it again gives the picture back. While it is holding your hand nothing else on the screen draws, however long you keep a finger down: the selection follows the finger the way the eyedropper does, with the same window under the crosshair showing where the colour is being taken from. One drag is one step back. It lets go when you tap the lit button again or take another tool, and the line telling you what to do lives exactly as long as the waiting does. Paint and captions live above the photograph and survive it untouched. Reveal is a tool like the others: take it and the picture goes grey at once, then draw over what matters and the colour comes back exactly where you passed; the eraser closes it again. Taking the brush or the marker puts it down, the way they put each other down, and so does leaving the drawing panel: the grey is a preview and does not outlive the screen it belongs to, while the strokes themselves stay and undo like everything else. Undo with nothing left to undo puts the tool down too, so the colour always has a way back. Its brush is three times the usual width, because colour is brought back in broad sweeps rather than outlines. Opacity works as you would expect — a half-strength stroke brings the colour half way. Arrows, outlines and captions are drawn over the top and stay in full colour, which is the whole point: on a photograph of a junction box the wire you mean is rarely the only red thing in the frame. One colour, which used to sit in that cell and picked the surviving colour by similarity rather than by hand, is switched off for now; it will come back when it has a place of its own. Shapes sit under one button that cycles. The button wears the shape it will draw, so the first tap simply takes it; each further tap moves to the next one, and the drawing on the button changes with it. The order is the order of taps: arrow, circle, rectangle, triangle, straight line, arc. Arrow comes first because it is what marking up a photograph needs most often. There is no step back around the ring, only a next step, so the far shapes cost a few taps; the whole list is written here for that reason, since a button can only ever show one of them at a time. The button remembers the last shape you drew with, so leaving for the brush and coming back costs one tap rather than five. To put it down, take another tool or the select button: tapping this one moves the ring instead. A long press was considered and refused: pressing and holding already means two other things here, immersion on the canvas and the guide on the Jot mark, and one sign must not carry three meanings. The marker is a button among the tools rather than a switch beside them: by mechanism it is the same brush laid down differently, but a hand says take the marker, not take the brush and change how it lies. An arc with fill closes itself into a half circle. A chosen shape is solid to the finger across its whole area, whether filled or not: two yellow corner rings resize it and a third cream ring, marked with four arrows, drags the whole thing anywhere on the sheet and a little beyond, whatever tool is in hand. The row of colour holds four: white, black, the wheel and the eyedropper. Yellow and red left the row when it became four — the wheel still has them, at the cost of a second tap. Work made before that keeps its colours exactly: a colour is stored as a number, and the numbers did not move. A fill uses the whole opacity you set, so a hundred means opaque and the outline is no denser than the middle; for a shape you can see through, move the slider and read the number you get. A filled or blurred shape may have its outline taken down to nothing: the body holds the form, and the finger still catches the shape whether an outline is drawn or not. An empty outline keeps a minimum, because at nothing it would vanish from sight while staying in the document, with neither body nor line left to find it by; take the fill away from a shape whose outline was nothing and the outline comes back to that minimum by itself. The circle holds its proportion at every corner, not only while you first draw it: pulling either ring grows a circle and never an ellipse, and the oval standing beside it is the tool for an ellipse. The two rings do the same thing as each other, so there is nothing to remember; the middle of a chosen shape drags it too, but the ring is there so that nothing has to be guessed; line thickness lives on its own slider, where the number is visible and the shape does not jump. A shape that is not chosen is still caught by what is drawn, which is what lets you draw inside an empty circle and keeps a large rectangle from swallowing everything beneath it. Weight, colour, opacity and softness are previewed by the dot. The eyedropper answers one question: what colour is the base of the sheet under your finger. Inside the frame that is a pixel of the source file if there is one there: the sheet is layered, so under an empty pixel of a transparent PNG lies the paper, and a half transparent one is answered by the mixture you actually see.  Beyond the sheet, in a hole cut out, or where nothing is left and no paper was chosen there is no base at all and nothing is taken — the eyedropper stays lit and waits. It carries a loupe showing that same base rather than the screen, so the pixels under the crosshair are the real ones and a refusal is visible instead of silent. Paint and captions laid on top are not the base and are not picked up. Softness belongs to the brush and the eraser only, so its slider appears with them and goes away with them; a soft eraser is the same code, which is why it costs nothing. The pill on the panel edge folds the whole panel away once a tool is in hand, leaving a narrow strip, and the picture is fitted again to the space that frees up; the exit goes with the panel, and the system back button leaves the screen while it is folded. The picture is held against the top of the free space rather than centred in it, so opening or folding a panel changes only its size and never its position: one edge stays put and the eye has nothing to chase. Any closed shape can become a blur window instead of an outline: the photograph shows through it out of focus, which is how a face or a number gets hidden. The blur reads the photograph itself, so a caption placed on top stays sharp. The marker multiplies instead of covering: yellow drawn over black text leaves the text black, so the line stays readable, and overlapping passes darken. Marker strokes always sit under ordinary paint, the way a highlighter sits under a pen on paper. Taking a colour off the photograph is the sixth swatch in every colour row, and it lands where that row belongs: in the paint, in the selected caption, in the crop backdrop; it switches itself off once the colour is taken, and the colour lands in the custom slot. The exit arrow is the first cell of the row of switches rather than a row of its own: a whole line spent on one button is a line taken from the picture. Paint sits above or below the captions. Dashes are a slider rather than a switch, and they are measured in line widths: at the far left the line is solid, further along the dash and the gap grow together, from a fine dotted rhythm to long strokes. Because the length is tied to the width and the width is held as a fraction of the frame, the pattern survives zooming and saving at full size without a unit of its own. A second slider for the ratio of dash to gap was refused: it changes not the drawing of the line but its weight, and weight is already set by width and opacity. Dashes are hidden for the eraser and the marker, where they mean nothing. The grid is a button in the row of switches, not a two-item carousel taking a whole line; the same button sits on the insert screen and pulls the same handle. A frame with corner marks appears in the corner of the picture whenever what you see is not all of the sheet you are working on, and puts the sheet back into the screen. It measures the sheet rather than the original file, so that after cropping it neither nags nor shrinks your frame to something that is no longer there, and it disappears the moment there is nothing left to put back. It is not in any panel: fitting is needed the same way on every screen, and it takes no room at all while there is nothing to put back. Nothing else ever does that: since the day zoom arrived, no screen and no tool moves the picture on its own, because how close you are looking is your business and not the application\'s. Fitting it back is therefore a possibility rather than a habit, and it lives here, among the other ways of looking, rather than as a button of its own on the home screen.'],
    ['Empty space', 'A picture that arrives with transparency of its own keeps it: the paper under the sheet starts as none rather than white, and saving to PNG gives back what was opened. White paper is invisible under an opaque photograph, which is why it stayed white for years without anyone noticing that it also painted over the empty places of a transparent one. The choice is asked once, when a new file opens; coming back to a page or returning after the app was killed keeps whatever you chose. Wherever there are no pixels — outside the sheet, where something has been cut away — the screen shows fine graph paper rather than plain black. Against a dark photograph black told you nothing about where the picture ended. The ruling holds its size on the screen rather than on the photograph, so it neither stretches when you zoom in nor collapses when you zoom out: it is the table, not the sheet. It never reaches a saved file. Its brightness is a slider on the cutting screen, running from black to white, because the edge of a pale photograph is invisible against a pale table and the edge of a dark one against a dark table, and which photograph you will bring is not something the application can know. The scale is neutral grey on purpose, so that the table never argues with the colours inside the frame. On the crop screen there is no table around the photograph: the whole of it is shown there, including the parts that will not enter the document, and the space around it belongs to the screen rather than to the document. Ruled, it would stop saying that nothing is there and start being wallpaper. Under the photograph the table is there as everywhere else, because a hole inside the picture belongs to the document and has to read as a hole: open a transparent PNG and its empty places are ruled on the crop screen exactly as they are on the canvas.'],
    ['Crop', 'The frame runs over the sheet, and with margins and set size switched off the sheet is exactly the frame: there is no paper around it to reach. The whole sheet is painted here for the same reason — you should see what you are choosing from. Save and share from this screen send what is inside the frame, and the frame stays a frame: bite off a piece, pass it on, keep adjusting. The back arrow applies the frame, as it does on every other screen: leaving means leaving with what you did. Nothing is lost by it, since the frame is a value rather than baked pixels and the step back brings it right back. Drag the corners. The bottom row holds four: the way out, orientation, free, and ratio. The orientation button shows both positions at once, the current one solid and the other faint, so that what a tap will do is visible rather than remembered. Free is a picture rather than a word, a frame with its corners moving outward, and it keeps a cell of its own because it is taken more often than any ratio. The ratio button carries the one you are on and leads round on each tap: original first, then one to one, then the rest. Original is the true ratio of the photograph you opened, four to three or sixteen to nine, worked out and shown as a number: a picture could not say it, since every photograph has its own, and a number says it exactly and tells you what you are holding. There is no step back round the ring, only the next step. Above them the guide lines stand as pictures rather than words, four of them. Empty frame is none; the frame crossed by two lines each way is thirds; the one crossed off centre is the golden section; corner to corner is the diagonals. Corner rounding lives on the shape slider alone, since it does the same thing without steps. What it cuts away is empty, not paper: there is no paper anywhere in Jot any more. The way out is the first cell of the bottom row and an ordinary button rather than a circle: a circle here means a swatch, that is, a colour you are about to take. The backdrop was removed on the fourth of September: with margins gone, no leftover from a set size, and the rounding cut into the photograph itself, there was nothing left for it to colour. The shape slider runs from square corners to a full circle, and whatever is cut away is left empty rather than filled: the rounding is cut into the photograph itself, before the lens correction, so the oval bends with the picture instead of sitting over it like a frame. On screen the empty part shows the checkerboard. In a PNG it stays transparent; in a JPEG it comes out black, since that format has no transparency and black is the floor that remains when there is nothing to paint with. The photograph never leaves the frame: margins keep the backdrop, not a stray piece of the original. A margin is measured against the frame rather than against the original file, so cropping the photograph leaves the proportion of paper exactly as you set it: a border a quarter of the picture wide stays a quarter however much you cut away. This screen shows the photograph and nothing else — no paper, no table, no grid. A dashed line shows the edge of the sheet you are about to get, and the paper that will surround the frame is drawn in its own colour instead of being dimmed away. Focus, tilt on either axis and angle all eat into the frame, and they are fitted together rather than one after another: the largest upright rectangle that the corrected photograph covers completely. Fitting them in turn would measure each against a different edge and leave paper in the corners. Taken together they cost far less than they do apart, because the turn has already eaten the corners the lens correction would have taken. Cropping no longer touches the size you typed. It did until the first of September, when the sheet followed the frame — crop to a square and the file was that square. Then the size gained a second job, making the white bands round a picture, and letting one hand quietly wipe out what the other had asked for was worse than the surprise it saved. The frame cuts the picture; the sheet stays the number you set, and reset clears it in one tap. With stretch the sheet keeps the area you asked for and takes the proportion of the frame instead. Paper appears around the frame only where the sheet is genuinely wider than what you cut, and it is drawn while you choose rather than arriving in the file. What lies beyond that sheet is dimmed, because it is screen rather than document. The frame reaches paper as well as photograph: it selects a piece of the sheet, margins included, by its corners and by dragging alike. With a ratio taken, a corner is dragged against its opposite: that one stands still because your finger never touched it, and the frame follows as closely as the ratio allows. Without it the frame was assembled from four loose edges and then repaired around its middle, and the middle had already moved, so both corners drifted — the one you were holding as much as the one you were dragging. Dragging a corner shapes the frame, and so does the ratio button, and so does the orientation button. If a size has been set, its numbers are retuned to the new shape at the same area, whichever of the three you used, so that the crop and the size screen never claim different shapes for the same thing. Without that the numbers won, and a square cut out of a tall photograph arrived on the sheet squashed back into the old proportion.'],
    ['Place', 'Margins are parked. The button is greyed and does nothing, and no sheet has any paper around it for the time being. The reason is a quarrel the app could not settle: crop bites the photograph while margins grow the sheet, and the hand quite reasonably expects the crop frame to reach the paper, which it cannot. Half a feature is worse than none, and on the third of September margins were put away for good rather than mended: a white sheet with the photograph placed on top gives you as much paper as you like and costs the app nothing. Everything else on this screen works as before, and nothing you have made is lost. What follows describes margins as they were, kept because the mechanism sleeps rather than being torn out. Three tools of equal standing, each behind its own button, and they behave differently on purpose. Margins is a mode: it latches on, turns on the red grips, and brings the backdrop colour with it — drag a grip inward from any edge and the sheet grows on that side. The backdrop was removed with them on the fourth of September: nothing needs paper under it any more. Add is an action: it picks one image and puts it on the picture. Stickers opens the pack. Clearing the margins sits next to the margins button, because that is all it clears, and it can be undone like anything else. The exit is the first cell of the same row. Nothing is switched on when the screen opens, so nothing is dragged by accident, and taking one tool lets the other go. Anything placed on the picture may also be dragged out onto the margins: a caption, an arrow, a sticker or a second image can sit on the paper beside the frame rather than on top of it. The room an object is given is measured from the sheet — the frame plus its margins — and it always keeps a little overhang past the edge, because carrying a corner of a sticker off the paper is a legitimate move rather than a mistake to be prevented. The screen of its own is gone from the second of September. Montage covered it to the last cell — add, stickers, grid, size, opacity, turn, delete — and a second door to one job is worse than a longer walk to it. Pictures and stickers are put down and edited there now, and the cell that used to open this screen is empty: the row keeps its four columns and waits rather than being filled for the sake of being full.'],
    ['Jot TIFF', 'A separate screen, and it does one narrow thing: it wraps the pages of a scanned TIFF into a PDF without unpacking them. The compressed stream is carried across untouched, so nothing is re-encoded and nothing is lost — which is also why the support is partial by design. It handles what PDF can carry natively: CCITT group 3 and 4, LZW, PackBits and uncompressed, one or eight bits per channel, one or three channels, strips rather than tiles, a single plane. A TIFF outside that set is refused by name rather than converted badly: JPEG inside TIFF, sixteen bits, tiled layout, separate planes. This is a converter, not a viewer — such a file cannot be annotated in Jot. It speaks every language the application does: its words live in the same dictionary, chosen by the same setting, so a scan opened in Finnish reads in Finnish. It had a dictionary of its own until 3.230.0 — three languages, and Russian as the default rather than English.'],
    ['Stickers', 'A pack you build yourself, one picture at a time. It starts empty. Add takes any image, brings its long side down to 512 pixels and keeps it as PNG, so transparency survives where it existed; a JPEG has none and will not gain any. Tapping a sticker chooses it, tapping again puts it on the picture, and delete removes the chosen one from the pack. Up to 200 stickers. The pack lives inside the application: it needs no permission, survives restart and update, does not appear in the gallery, and goes away when the application is uninstalled.'],
    ['Adjust', 'Pick a quantity from the row of signs and move the single slider; the name of the chosen quantity stands next to it. Brightness, contrast, saturation, temperature, gamma, sharpness, blur, grain, vignette. Sharpness and blur make saving slower. One visit to this screen is one step back: the state is taken when you first move something, so nine dials moved in one visit undo together, and looking in and leaving again costs nothing. Cropping works the same way from 3.41.0: shape, backdrop and the frame itself are one visit and one step back, because to a hand they are one action. Auto stood in the bottom row until the fifth of September and has gone. It called the same engine as fix on the home row, at one fixed strength and without the paper reading, so it was a smaller version of that button rather than a second opinion: one door to a thing is enough, and fix keeps it. Nothing was lost with it — fix stretches the tones the same way and goes further. The numbers it leaves in the sliders can look odd: a dark photograph with clean highlights comes out with brightness down and contrast up, and that is the stretch, not a slip. Gamma moves only when the midtone has left the middle, and never by more than thirty — dusk on a photograph of a cabinet is a fact, not a flaw. Colours took its place. The button opens a screen of its own: eight circles in two rows of four, one slider, and three cells under it saying which of the three quantities the slider turns — hue, saturation, lightness. Each circle is a stretch of the hue wheel, and every pixel belongs to the one or two nearest it, so a change fades across the boundary instead of stepping over it: the sky keeps its gradient. The centres are spaced by eye rather than evenly, because between blue and magenta the eye sees more than it does between green and aqua. This is the tool for touching one colour and leaving the rest: the greenery in a photograph without the brickwork beside it, or the yellow of a cable without the yellow of the wall. It is worked out pixel by pixel rather than by the cheap filter path the other quantities use, since a hue is a function of all three channels at once; while you move the slider a reduced copy is used, and the full picture is done when the file is written. The button at the bottom is the plain reset. Temperature and saturation of the whole picture are left alone by fix: grey balance needs something grey, and on a photograph of foliage there is none, while the colour of a marking is data rather than taste. Fit whole puts the picture back exactly where it lands when a file is opened — a little below the Jot mark, not against the top edge: one opening, one fitting, one place. A second floating button appears beside fit whole once anything has been moved, whether by hand or by fix: hold it and the picture shows itself as it was before the corrections, let go and they come back. It is held rather than switched because a switched comparison can be left on and then the corrections look lost when they are not. It takes off the corrections only — filters live on their own screen and stay, since a comparison is of one thing against another rather than everything against nothing. If the tones are already even it does nothing and says so. If they could not be read at all it says something else, because a failure wearing the face of an ordinary answer would otherwise pass for a result. If the stretch needs more than the sliders can give it does what it can and says that too. Leaving the screen puts the tools back on the home row and fits the picture into the space that frees up. Every slider with a zero in the middle — the four corrections that go both ways, and the three rotations — has a notch at zero, marked on the track so it can be seen before you touch it. A finger let go near zero settles on zero and the app taps once to say so. The notch takes nothing away: the track is widened by the notch rather than the values swallowed by it, so one degree and minus one degree are still there, just a little further out than they used to be.'],
    ['Sheet', 'The screen that owns the sheet rather than the photograph: how big it is, what colour the paper is, and which way round it stands. Size and Backdrop have sections of their own; what follows is the turning. Four cells: spin right, spin left, mirror, upside down. Each of them has its opposite in the same row, so nothing goes round any more and nothing has to be remembered. Until this version there was one spin cell and one mirror cell, and both walked a ring: turning the other way cost three taps and three steps of undo, and the mirror travelled four positions with the axis kept in its head. That was the price of a row of four, and the row is no longer the only one here. Taking both mirrors together gives a half turn, which the ring could not reach at all, so a mark in one corner can now be sent to any of the other three. The free angle is not in this row: it lives in the light geometry row on the home screen, and a cell that leads somewhere instead of doing something has no place among three that do. Both spin and mirror step back like anything else: the picture itself goes back with the markup, one tap of undo for one tap of the tool. Everything turns with the picture: captions, shapes, stickers, freehand paint and whatever has been cut away, and the crop and margins go round with it too. Turns and mirrors survive the application being killed, although the copy kept in memory is the original file: what is written down is not the turned pixels but the turn itself, and it is replayed when you come back. A mirror reverses everything it carries across, captions and inserted pictures included: they lie on the photograph rather than above it, so a caption that comes back unreadable is the answer and not a fault. Shapes and arrows are held by two points of their own and are turned round by the move itself, with nothing left to reverse. Mirror a second time and the writing reads again. Fine degrees for a crooked horizon are set by angle in the light geometry row, not here. Margins used to be taken here, by the cell beside turn and the backdrop. They are switched off. They are measured against the frame rather than the original file, so cropping leaves the proportion of paper exactly as you set it. They are fractions of the frame, and of different sides of it: a tenth on the left is a tenth of the width, a tenth on top is a tenth of the height. On a four to three photograph equal fractions therefore give unequal paper — four hundred points at the sides against three hundred above. That is the measure, not a fault; an even border on all four sides is a separate thing and is not built yet. Tilt lives on this screen from this version, in the two rows below the turning: one slider and, under it, the way out, the two axes and reset. It used to have a screen of its own, entered from the cell beside mirror; the reason given was that every tool deserves its own screen, and it outlived itself — a slider and two axes fit here with room to spare, and one screen fewer is one door, one number and one way back fewer to keep right. Both axes are built: vertical leans the width along the height, horizontal leans the height along the width. One slider serves both, and it drives whichever axis is taken; switching axis changes nothing, it shows you the other number. While your finger is on the slider the frame is held still and the picture moves under it, so you are correcting against something that does not follow you. The two axes are fitted together with focus and angle rather than one after another, and that matters: a shape narrowed at the top and at the side has an upright rectangle of its own, and fitting each in turn would shrink the frame a fifth more than it needs to. Reset clears both axes and nothing else. It is the only reset on this screen, and that is deliberate: spin and mirror each have their opposite cell, and a slider has none — an exact zero cannot be caught with a finger, and nearly zero is a crooked horizon for the rest of the work. A set size has no reset cell either; type over it or step back.'],
    ['Size', 'Living inside the sheet screen, in its first row: the sheet holds five rows now — size, turning and mirrors, the tilt slider, the axes with their reset, and the row of ways out. It went out with margins for a few hours on the third of September because the two shared a row, which was a misreading: the row was shared, the tools are not. Margins draw paper; a set size gives the number of pixels the file will have. The exported pixel size of the sheet. Width, height, padlock, done — four cells, and no word beside them: the upper rows of a tool screen carry marks rather than labels, and the word for what they set stands in the lines below. There is one way of applying it, and the padlock is the only switch. Type numbers, tap the tick, and the sheet becomes those numbers exactly; the picture is scaled until it fits inside, keeps its proportion, sits in the middle, and whatever is left over is filled by the backdrop. With the padlock closed the second number follows the first in the proportion of the picture, so the two agree and nothing is left over. Open the padlock and they can disagree — and the paper that appears is the white border you asked for. Stretch and quick fit were two answers to one question and are gone; stretch was the only edit here that broke a picture without being asked to. There is no reset cell for the size: the only reset on this screen belongs to tilt, so a size is cleared by typing over it or by stepping back. Typing changes nothing by itself — with the padlock closed it would ask for a sheet forty thousand wide before your hand had finished the number. The colour wheel and the eyedropper beside reset set the same backdrop as Crop and Margins do, so a colour picked here shows up there. Numbers beyond twelve thousand a side or forty megapixels are brought down, but the proportion you asked for is kept and the toast says what was used instead. A quarter turn swaps the two numbers, because the fields show the sheet that will be written, not what your hand typed. Cropping no longer rewrites the size: the frame cuts the picture, and the sheet stays the number you asked for. With the padlock closed the second number follows the first by the proportion of the frame, and the picture grows or shrinks whole. Open it and the two numbers stand as typed: the picture is stretched to them, and its proportion changes because that is what you asked for by opening the lock. Neither way leaves paper around the picture — there is no paper outside the frame anywhere in Jot any more.'],
    ['Letting go', 'The shredder is gone from the third of September, and with it the two holds and the red bar. A clean sheet now comes from one place only: restart the application, in the settings. What you get is a white A4 in portrait, as wide as your screen is in points — a small screen makes a small sheet, and that is the whole of the arithmetic, because drawing is heavy work for a phone and this application does not press you towards it. If you want a transparent sheet instead, the millimetre table and the cutter with its background removal will both give you one. Freeing the memory is no longer a destruction to be guarded: the file you opened is untouched on the device, only the markup goes, and the sheet that replaces it is paper rather than emptiness.'],
    ['Backdrop', 'The paper behind the photograph has a colour and an opacity. The colour is a swatch — white, black, one of your own, or picked off the picture with the dropper; the opacity is a slider, and at zero there is no paper at all and the chequer shows through. PNG carries that transparency into the file as it is. JPEG and PDF cannot, so there the missing paper turns into a shade of black — half the opacity, half the darkness — and the screen shows it that way while a non-PNG format is chosen, so what you see is what you get. When transparency is doing real work — a mask, a cut-out, margins, fitting — Jot switches the format to PNG by itself and says so.'],
    ['Lighter', 'A setting, off by default, because Jot does not shrink your photograph without saying so. With it on, a photograph larger than eight megapixels is accepted scaled down to that, and Jot says so once when it opens; everything after that — drawing, corrections, filters — runs on the smaller picture and runs faster. It changes the next photograph you open, not the one already in your hands. The stack of steps back is untouched: it holds descriptions rather than pixels, so shortening it would take away your steps and give back no speed.'],
    ['One colour', 'Pick a colour on the photograph and everything else goes grey: the yellow cable stays yellow, the room around it does not. It is the same pick as cutting by colour — a point and a tolerance, every similar pixel rather than a connected patch — and only the outcome differs, so it lives on the same tool: tap the wand a second time and it switches between taking the colour away and leaving only it. It is a stage of the photograph rather than a filter, so your paint and captions keep their colours: they sit on the sheet, not in the picture. A step back removes it like any other edit.'],
    ['Montage', 'The cell is called montage from the second of September, and it wears a patch rather than scissors: a dashed square for the hole and a solid one laid over it. Scissors would have promised the old cutting, and the tool is a different one now — take away and put back on one screen. Slava chose the word over collage, which is what I had proposed: montage is what the trade calls building a whole out of what was cut and what was put in. Erasing the photograph itself down to transparency: on the drawing screen a brush puts paint down, here it takes the picture away, and one word with two meanings on one screen would be a trap. Four tools: a line, keep, a lasso and the wand. The line takes the photograph away under your finger, and a second tap on it switches the line to putting it back — which of the two it is stands written on the button itself, always. Keep is the reverse of the lasso: trace a thing and the thing stays while everything outside it goes, so what was around it becomes a hole. It is the same outline as the lasso, drawn the same way and softened by the same slider; only the side that survives is different, so a thing traced badly can be traced again either way round. Both lassos show a dashed trace while the finger is down and cut when it lifts: with the reverse one the picture would otherwise vanish at the first millimetre and the rest would be traced blind. The trace shows the closing chord too, because the area is taken from the closed path. The oval and the polygon lasso were taken out when the row became four; work saved before that still draws them, you simply cannot make new ones. The freehand outline is traced with a finger and closes itself, taking the whole area inside rather than the strip under the finger; the polygon lasso sets its corners by tapping and waits for done, which suits technical subjects, because a hand shakes and a straight edge does not. Removal by colour takes everything close to the colour you tap, within a tolerance you set, and it takes all matching pixels rather than one connected patch, because sky on a photograph of equipment is usually broken up by branches and cables. It has one outcome and no hidden second one: to keep a single colour and grey out the rest, use one colour on the drawing screen, where the button stays lit while a colour is held. The restoring brush matters more than it looks — a hand always errs at the edge, and without it the only way back is undo. What is cut is kept as paths rather than as changed pixels, so a step back costs nothing and survives cropping. You may cut anywhere on the sheet, and you may crop after cutting: neither moves the other. Geometry is the exception and is named on its own screen. The cut goes through the whole sheet, backdrop included: cutting only the photograph would leave the white sheet showing through, which is not transparency at all. It goes through the sheet and stops there: paint, captions and stickers are marks on top rather than part of the picture, so an arrow drawn over a background survives the background being taken away. Two things do behave as picture and vanish with it — a highlighter stroke, which has nothing left to tint, and a blur window, which is a window into the photograph and shows nothing where the photograph is gone. Jot keeps a copy of the opened file inside itself, taken each time a file opens successfully, and it is that copy which brings the work back after the system closes the app: you open Jot and the photograph is there with everything you drew on it, which is why the file need not be in your gallery at all. The copy and the markup are matched by a signature of the file, so markup from one photograph can never land on another. A line says so when it happens, because a picture appearing by itself would otherwise read as a fault. A button that has gone pale is not broken and not asleep: touch it and it will say why it cannot act. Jot keeps a short log of its own failures inside itself; a failure that repeats every frame is written once rather than a thousand times. Some failures are deliberately silent because nothing is lost by them — a haptic tap that did not fire, a filter probe that answered no — and each of those carries its reason in the source rather than being merely left empty. Some are pale because there is nothing to do just now — a reset with nothing to reset — and those simply do nothing. Others are pale because the ability is switched off in this build, and those will tell you so. Margins and a set size are among them again, from the third of September. What does not come back is the ladder of undo: it weighs more than the document, it is not kept, and after a restore there is nothing to step back through. If the copy is lost while the markup survives, the markup is discarded and Jot says so — hunting for a file by its measurements would be guessing, and opening it again is quicker. Before a file is written Jot checks that the sheet was built at all: a canvas may quietly fail to start on a device short of memory, and the old result was a file that opened blank. If the sheet could not be built, nothing is written and Jot says so, so that a file you already have is never replaced by an empty one. Above twelve megapixels it also reads a handful of points where the photograph should be; if they all come out clear the file is still written, but with a warning, because a sheet cut away to nothing is a perfectly legitimate result and refusing to save it would be worse than a warning nobody needed. Duotone maps the photograph between two tones of your choosing; it starts from the colours of the app itself and the eyedropper beside it reads the original photograph rather than the filtered view, because a colour taken from a filtered picture would feed back into the filter and shift under your finger. Threshold has no half measure — it always cuts — so its strength slider moves where the cut falls instead. The filters come in three families. Colour matrices and curves recolour the photograph — grey, sepia, negative, posterise, pop art and the rest. One works on shape instead of colour: emboss reads each point together with its neighbours, so it finds edges rather than tinting them, and the strength slider blends the effect back towards the untouched photograph. Four of its family — outline, pencil, charcoal and neon — were taken out on the first of September. A hole may also be filled with a colour of your choosing, on the cutting screen: the colour button in the footer opens the same picker as everywhere else, and once a fill is in place that button wears the fill itself and its word changes to say that a tap will now take it away; the eyedropper next to it takes a colour from wherever the picture still has one — inside a hole there is no ground, so it refuses rather than inventing a shade. The fill is not the backdrop: the backdrop is paper under the photograph and the cut goes through it, while the fill is what the cut-away places are painted with, and it belongs to the cuts, leaving with them when a new photograph is opened. With a fill in place the file has no hole at all, so the warning about black holes stays quiet. Only PNG keeps transparency; in any other format an unfilled hole is filled black, because white reads as paper and black reads as absence. The corners left outside a rounded frame show what they will be rather than a grey veil, on the crop screen as on the canvas: ruling where the sheet will be empty, the backdrop colour where it will not. Emptiness always looks like emptiness on screen — the ruling shows through it whatever format is chosen, on the crop screen as on the cutting one. The format is your choice and Jot does not change it: only PNG keeps transparency, and if you save with a real hole to a format that has none, Jot says once that the empty places will come out black. Saving the same work twice, once flat and once with transparency, is a normal thing to want. A finished piece of work can go straight into the sticker pack from the saving screen: the sheet is built exactly as it is built for a file — crop, cut and fill included — and always as a PNG, because a sticker without transparency is a black rectangle. The limit of 512 points along the longer side and the size of the pack are the same on both roads into it. The handle at the top of a panel folds it away, by a tap or by a drag up and down. The circle of screens lives lower, on the strip just above the row of commands: a small ball sits in the middle of it: a tap on the ball moves the circle on — correction, caption, drawing, dispatcher — and a drag takes it either way. The ball is only twelve points across and catches the finger from four times that, which is why it can be hit without looking. The strip lies in the same place on all four, which is why the circle can leave the dispatcher as well as enter it. Screens outside the circle are reached from the dispatcher as before, and from any of them the ball leads back into the circle in one tap: outside the circle there is no next stop, so it takes you out to the dispatcher, which is the nearest one there is. Copying belongs to the cursor: take it, choose the object, and hold a finger on the move handle — the object goes into the pocket. There is no copy button in any row any more: both left when the rows became fours, and the floating button in the corner is what lays a copy down. With a drawing tool in hand neither door works, and both say so rather than going quiet: a hand that draws neither takes nor lays down. A shape you have just drawn is therefore not copied on the spot, which is deliberate; a floating button appears in the corner, under the compare button, wearing the shape of what you copied, and each tap on it puts another one down. That button is also how you know the pocket has anything in it, which is why it is a place of its own rather than another state of the button in the row: the button in the row copies and does nothing else, and it goes pale when there is nothing selected to copy. Copies go down on the same screens they are taken from — where a thing is edited is where it is copied and pasted. What decides is the hand rather than the screen: on the drawing screen the cursor takes and lays down, and with a brush in hand the button goes pale and says so; on the insert screen there are no tools to ask about, so it simply works. Copies land inside the sheet: in the part of it you are looking at rather than beside the original, which may be off screen, and in the middle of the sheet if you are looking away from it altogether. They step down and across so that none hides another, and the ladder turns back at the edge instead of walking off the sheet, where a shape is not drawn at all and only its handles would show. The pocket holds one thing, survives opening another photograph and does not survive closing Jot. A loupe window sits along the bottom of the screen while a finger is down, magnified two to six times as you choose. It is a window rather than a circle over the finger, because a circle covered the very place the work was happening, and it holds still for the whole stroke: it used to move aside when the finger came near, which was worse than being in the way, since the place you are looking at has to stay put or the eye catches it twice in one movement. What has been cut away shows there as the same ruling as on the canvas rather than as black, black being indistinguishable from a dark photograph. A row of insert sits on this screen from the second of September: add a picture, open the sticker pack, turn the grid on — the same three doors the insert screen carries, not copies of them, so they cannot drift apart. The grid had never been here at all, though a hand drawing a lasso has as much use for it as a hand drawing a line. Counting from the bottom: the ribbon of commands, then that row of insert with the way out first in it, then the older row of cutting, where delete now stands where the way out used to. Delete removes the picture you inserted, the same door the insert screen uses, and it works here because you can insert here. Reset beside it throws away every cut piece at once. Both are a single tap and both destroy, and both sit a finger width from the way out; a step back is all that guards them, and that is a question still open rather than an answer. Putting a picture or a sticker down here drops the cutting tool: no cell in the tool row is lit, and until you take one again a finger moves the picture rather than eating the photograph under it. That is the whole reason the tool row can be dark — before there was anything to insert here, a finger on this screen could only cut, and there was no state in which it did nothing. Delete goes pale when there is nothing selected to delete, and says so if you touch it anyway: on the insert screen the same button simply disappears along with the sliders, because that row has no shape to keep, while here it stands in a four and taking it out would break the row. A button gone pale is better than a missing one and better than an empty one, because it explains itself. Tap a picture or a sticker and the four sliders of cutting slide away to the left while three of the object come in from the right — size, opacity, turn — and the block changes height along with them, in one movement. There is no second screen behind that: the badge still says twelve, because you have not gone anywhere. Tapping a lit tool again lets it go, and the row goes dark: the line has three positions rather than two — take away, put back, nothing taken — so that one rule holds for all four cells. Without that there was no way at all to put a tool down by hand, and after the first cut a sticker could not be touched again.'],
    ['Guides', 'Four kinds of line laid over the photograph: none, thirds, golden section and diagonals. Centre and safe area were dropped with the row that held them: the first is about placing a shot, the second about print bleed, and a marker needs neither daily. A finer graph paper was tried and dropped too: the twelve-step grid turned out to be fine enough, and anything denser only gets in the way. They serve the eye and never reach the file. Everything is measured in fractions of the frame rather than screen points, so zooming in does not thicken the grid: the cell grows with the picture. They are split by the job. Composition lines — thirds, golden section, diagonals — are chosen on the crop screen, where a frame is actually cut. Measuring lines are switched on by a button on the drawing and the insert screens, where things are placed and measured by them: a choice between two is on or off, not a carousel. One shared setting used to mean that a choice made for cropping turned up in drawing, and lines appeared that nobody had asked for. They show on those screens only: lines left over on the home screen would read as a mark that will not come off. A fifth use needs no choosing at all: while a finger is on one of the lens sliders, lines appear over the sheet and go the moment the finger lifts. Which lines depends on what the finger is correcting. The angle slider straightens a horizon, so it brings five level lines across the sheet and nothing else; the tilt slider brings five lines across the axis it is set to. In each family the middle line is drawn a little stronger, as an absolute to hold to when the picture itself offers nothing to line up against. Barrel correction bends the edges rather than levelling anything, so it keeps the square grid, twelve cells across the shorter side. It is drawn square to the screen rather than to the photograph, which is the whole point of it: the picture leans under the grid while the grid stands still, so a wall or a doorframe can be brought upright against it. Nothing is remembered and nothing is left behind, in the same way the thirds under a finger on the zoom slider are not. A spiral and a perspective grid were left out: each would first ask which corner or which vanishing point, and nothing would be visible until you answered.'],
    ['Filters', 'Twenty-five of them, and the last one works differently from all the others. Twenty-four paint a point: they take the colour that is there and give back another colour in the same place. One of them used to move the point rather than paint it, and it is gone: easy geometry does the same bowing from its own screen, with one bake per frame instead of a filter on every draw. That needs a third machine, after the colour matrices and the convolutions, and it is built by redrawing the sheet in a grid of small pieces rather than by mixing colours. Strength works the same as everywhere: it mixes the distorted picture with the original one. Two things follow from moving points rather than colours, and both are deliberate. A hole cut earlier travels with the picture, so its edge bows along with everything else. Arrows and captions bow too, because they sit on the sheet and the sheet is what bends; a caption inside a glass ball reads oddly, and that is accepted rather than prevented. One filter over the whole picture, put on last: the photograph, the corrections, the paint, the captions and the stickers all at once. Change it and everything changes; take it off and nothing remains. Strength blends it with no filter at all, so a light sepia costs one slider rather than a separate entry. Trying six and settling on the seventh is one visit and therefore one step back, and the step really puts the filter back: which filter is on, and how strongly, now travel in the saved state along with the paint and the crop. Most are one colour matrix each; posterise, thermal and distance are curves per channel, because a step, a fold and a pressed middle cannot be written as a matrix; mosaic is not a colour filter at all but a change of size, and it is the one that hides a face or a plate. By colour keeps one colour alive and greys out the rest, which is how you say look at the yellow cable without drawing a single arrow. It starts working the moment you take it: the point it reads from sits in the middle of the sheet and the tolerance starts about a third of the way along, which is where the effect reads clearly on most photographs; widen it to keep more, narrow it to keep less. Tap anywhere on the picture to move that point; a loupe shows what is under your finger while it is down. Being a filter, it greys the arrows and captions along with the photograph, exactly as its neighbours do. Strength works differently where it must: for the stepped ones it changes the number of levels, since blending a step with a straight line gives a straight line rather than a gentler step. Some of them leave transparency alone and some paint it: posterise has no idea what nothing is, and neither has thermal. That is a property, not a fault. Duotone alone carries two tones of its own — shadow and light — with the swap button beside the reset: it puts the pair the other way round in one tap, instead of setting each tone again through the wheel. Swapping makes both tones yours, so the reset stops being idle and has something to return to. The two rings on the button move with the tones: the filled one is on whichever side now holds the darker colour, so the button shows the state rather than the deed. With sound on it answers with a short bright ring. The samples are your own photograph, because sepia on a face and sepia on a wiring diagram are different decisions. Seven were taken out on the first of September: blueprint, solarise, outline, pencil, charcoal, neon and fisheye. Fisheye took the grid distortion with it, and nothing was lost by that: easy geometry does the same barrel and pincushion from its own screen, with one bake per frame instead of a filter on every draw. Three arrived, and a fourth left again two days later. Africa is sun at noon and dust in the air: red up, blue cut hard. Helsinki is fog: colour down forty, everything pushed to blue-grey, blacks lifted, because fog does not give you real darkness. Distance flattens the midtones toward one value and leaves both ends whole: the everyday clutter of the middle goes and the silhouette stays. It is not posterise; that one steps, this one presses. A filter taken out does not break older work: a name the application no longer knows becomes no filter at all, rather than failing in silence. One cell after random opens a factory of frames rather than being a frame itself, the same way random is a door rather than a filter. The ninth frame is not in the grid at all but in the fourth place of the row of commands, and it is the only one with something inside it: shell writes the border rather than drawing it. Type into the line below the row and a band grows behind the words, from the top left corner to the right; when the side runs out it turns down the right edge, then along the bottom and up the left, and on completing a circle it steps inside the frame and starts the next turn, the way a snail does. The letters turn with the side they sit on, so the four sides read as one ribbon rather than four scraps. The slider under it means the height of the letters here rather than the place of the border: shell has no place to choose, it always runs from the outside in, and the word beside the slider changes with it. The width of the band follows the height of the letters, since two numbers for one thing would drift apart at the first edit. Text that will not fit is shrunk in steps until it does rather than being cut off, and it will not shrink past a third of what you asked for. There is a magnet on the turn: text that has all but filled a full circuit is spread out by its gaps until the tail meets the head, so the ring closes without a seam. Seven tenths of a circuit is the threshold — nearer than that and it is pulled shut, further and it simply ends where the words end. Emoji count as single characters here, skin tones, flags and joined families included, so a line of them comes out whole rather than in halves. The letters themselves are not stretched, only the spaces between them: a stretched letter reads as a printing fault, spacing reads as typesetting. The line you type into stands at the top of the panel rather than the bottom, where it is easier to see and to type.  The band starts white with black letters and takes any colour you give it from the same circles as everything else here; the letters always take the opposite of the band, so they read whichever colour you choose. White rather than the paper of the sheet: this frame has words inside it, and being readable matters more than matching the paper — and on a transparent sheet there is no paper to match. Like every frame it is a filter laid over the assembled sheet, so it does not lean with the angle and does not bend with the lens: it is a card around the picture rather than something written on it. The second cell of the grid, right after no filter at all, is lens: it moves the colour channels apart instead of painting them, red drifting one way and blue the other while green stays put, the way a cheap lens spreads them at the edges of a frame. It costs three passes over the sheet rather than one and counts no points by hand, and its cell shows a real sample rather than an icon, worked out the same way the picture is. Threshold left the grid to make room, and the count of cells came out even without a single blank: six rows of four. Four frames in the common grid gave two cells called negative — a filter and a frame under one word — and a factory grown to twenty would have broken the filter grid outright. A frame is a pair of clear glasses with a border. Being a filter, it goes on last, over everything — which is what a decoration should do, and here that is the way the thing is built rather than a promise somebody has to keep. The factory has a slider of its own, called edge rather than strength, because for a frame it means not how much but where: it runs between two ends — at nothing the border stands outside and the photograph is pressed inward by exactly its width, so not a point is lost; at full the border lies on the surface and the photograph keeps its size while the edge goes under. In between, part of each. Pressing inward costs a resample, so fine text on the photograph softens a little; at full there is no resample at all. There are eight, and each is a different mechanism rather than a different picture: a line, a doubled line, a dash, a bevel, a field, a shadow, four corners and a repeat. Almost everything else can be built out of those, and nothing at all out of eight similar ones. The factory grew from four to eight without a single cell of the filter grid moving, which is what the door cell was for. Their colour is the backdrop of the sheet until you choose otherwise: a frame is part of the paper rather than paint, and that stays the default rather than the rule. The row of circles on the factory screen is the same one the crop screen carries — white, black, your own colour, eyedropper — and reset gives the paper back. The cells in both grids carry drawn marks rather than previews of the photograph: a border a hundredth of the shorter side wide is not visible at all in a ninety-six point square, and eight such previews come out indistinguishable. A mark says what the frame is made of — four brackets, cut corners, two lines — and the hand understands it before it reads the word. What it looks like you see on the photograph itself, at full size, the moment you touch the cell. The negative alone keeps its own: film perforation is black by the definition of film. The first of them is random, and it is not a filter but a throw. Its cell carries two dice instead of a preview, because there is nothing to preview: until the throw, no filter exists. Tapping it does not set a filter — it opens a screen of its own, which arrives from the right and looks much like the filter screen it replaced. There is no preview there either, and none is wanted: the whole screen is the preview. Back and forward walk a shuffled deck of every real filter; each step also throws a new strength, somewhere between a quarter and four fifths of the track, because the point of a throw is the strength as much as the filter. Neither the strength you set by hand nor the order of the deck survives: step again and both are thrown afresh, leave and the deck is forgotten. The arrow returns to the filters you came from; more means done and takes you out to the home screen.'],
    ['Appearance', 'Five themes, shown as swatches with their names under them, and the name matters: eighteen percent grey is the photographer\'s reference grey rather than merely a grey. One of the five is named after the application and takes the colour of the Jot mark; it carries the house yellow as its accent, and the accent follows the theme only for as long as you have not chosen one yourself. Choose a colour, and it stays through every change of theme. The yellow is in the accent row as well, so any theme can wear it. Five colours there rather than six: blue stood too close to teal, and a record that chose it now reads as teal rather than falling back to no colour at all. An accent is safe as a fill on any theme, since the letters on it are chosen for it; as a letter it is not, and on a light theme a colour too close to the background steps aside and lets the theme\'s own ink through. Darkening the colour instead was tried and refused: yellow on its way into shadow turns olive, still misses the mark and stops being the house colour. A yellow background was refused: a saturated colour around a photograph shifts how you read the colours inside it, and this is a tool for recording what is there.'],
    ['Voice', 'Three kinds of thing get said, and they are not governed together. A refusal always speaks: you pressed a button that could not act, and silence there is indistinguishable from a broken app. An outcome — saved, copied, work restored — speaks only when voice is set to all; short, the default, keeps those quiet because you can see them happen. A hint that teaches a gesture is said once in the life of the app and again only after a reset. The switch sits at the foot of the settings beside reset, and it names its own position: voice short, or voice all.'],
    ['Debug badge', 'Off by default, switched on in the settings, in the lower of the two rows at the bottom — the one that belongs to the taking-apart rather than to the hand: badge, lighter, log, BETA. It used to live inside the Log screen itself, which was wrong by one small measure: a hand looks for switches in the settings, and opens the log having already decided what it is looking at. When on, a small line sits in the top left corner and never moves: the number of the screen, its name, and whatever tool or mode is running. It reads 7 · sheet · sel, and it says the same thing on your phone as in the chat, which is the whole point of it — one name for one screen on both sides of the conversation. The words come from the code rather than the dictionary and stay English in every language: a translated badge would give the two of us different names for the same screen. The number is the place of the panel in the internal list and the canvas is zero, so a new screen is added at the end and never shifts the others. Nothing about the badge reaches the file; it is drawn over the app, not into the picture. The home screen has no number of its own and never had one: the badge names the open panel, and the home screen is the absence of one. It reads zero and canvas there. Screen one is crop, and the count starts from it.'],
['Feedback', 'Sound or silence, and sound is the default: three events out of all of them speak, and hearing them the first time is worth more than the quiet. Sound on Android travels the media channel and is heard even with the ringer off, so it can be turned off in one tap. A buzz was considered and dropped, because vibration needs a system permission and Jot asks for none. The sound is a knock rather than a tone, computed rather than stored. Only three things speak: a panel sliding, a colour taken with the eyedropper, and a file saved. Nothing that you can already see needs a sound.'],
    ['BETA', 'Off by default from the fifth of September, and it now switches something real: the debug badge and the log. With it off those two cells are dimmed and deaf — visible, so that you know they exist, but not to be pressed. Hidden would have been worse: a thing that is hidden cannot be told apart from a thing that was never built. Turn beta on and both wake up; turn it off again and the badge goes out with it, because a switch that switches nothing off is not a switch. It stood on by default while nothing hid behind it, and that was honest then and would be wrong now: this is the workshop, and the first thing a hand meets in the settings should not be ours.'],
    ['Searching the reference', 'A field at the top of this page, from the third of September. Type a word and press the magnifier: every place it occurs is coloured, and you are taken to the first of them. Press again for the next, and after the last one it comes round to the first — there is no window telling you it has wrapped, because there are no windows in this application at all. Nothing found means nothing coloured, which needs no announcement either. Upper and lower case are not distinguished: you are looking for a word, not for a shape of letters. Opening this page always clears the field, so the reference greets you whole rather than holding somebody else\u2019s find.'],
    ['Icons only', 'The last cell in the language grid, marked with a drawn sign rather than a flag — three shapes in place of three words. It stands last and not among the languages, because it is not one; from the third of September. It is not a language and has no dictionary of its own: English stays underneath it, and the words are simply not shown. They are hidden rather than removed, so the voice and the long press still know them — a blind reading of the screen loses nothing. Settings, this reference and the log keep their words in full, because those three explain, and explaining cannot be done with a sign. Hints stop appearing altogether, with one exception: the line after saving still names the folder and the file, because a path is an address rather than a word and this is the only place it is spoken. Cells that carry no sign keep their word as well — an empty rectangle is worse than a word in any language.'],
    ['Names', 'The source file keeps its own name, followed by date and time to the second: KOHDE_A12_16-08-2026_15-32-07. When a source has no usable name, a remembered prefix is used instead. Rename freely before saving.'],
    ['Saving', 'JPEG 92, JPEG 100, PNG or PDF. Pictures go to Pictures/Jot and a PDF goes to Download/Jot, because a document is not a picture and the gallery will not take it; the cell in the footer says only Jot, because the full path will not fit in it; the toast after writing says the whole path, so you always know where the file went. Or a folder you choose, through the chooser the system itself puts up: that road takes the work anywhere at all, including a folder named Jot at the root, which the app itself may not create. A finished sheet can also go straight into the sticker pack from the same footer. Transparency requires PNG and the format switches itself. The screen draws from a reduced copy of the photograph so that a large one stays quick under the finger; the file is written from the original at full size, and so is the loupe.'],
    ['View', 'There is no button for this. Press and hold the picture to enter it: both bars go away and only the Jot sign stays. Two fingers zoom, a tap leaves. Holding does nothing while a drawing tool is in hand — there the finger is a pen. Leaving is a touch anywhere on the picture, and it does not have to be a still one: while the sheet is fitted to the screen there is nowhere to move it, so a touch means one thing only and a thumb that rolls a little still leaves. Zoom with two fingers and the picture can be dragged again, because now it has somewhere to go; from then on a touch that travels drags rather than leaves, and a short one still leaves. The system back button leaves as well, and so does the Jot sign, which comes out here on its way into the settings. Whatever you did to the view inside — how close you looked, where you dragged it — stays inside: the picture returns to exactly the view you left it at.'],
    ['Session', 'Android kills applications that sit in the background, and no application can forbid it. So Jot copies the picture to itself when you open it, and writes down the marks whenever you leave the screen. Come back and everything is where you left it, even if the original has since been deleted from the phone. The copy is replaced only when another picture opens successfully: a file that fails to open has no power over the copy you already have. Failing to open now includes failing to answer at all: a very large picture can be abandoned halfway through decoding without a word from the system, and Jot waits twenty seconds and then says so rather than leaving you looking at the previous picture wondering whether you pressed anything. One picture is remembered, not a history. The step back does not survive: it weighs more than everything else together. The picture stays where you put it. It is laid out once, when the file opens, filling the width from the top; after that only your fingers move it. Changing tools or panels no longer refits it, so a close look survives a trip to another screen and even the app being killed. Fit whole lives in the row of floating buttons above the tools of the picture and shows up only while there is something left to put back; immersion returns you to exactly the view you left. A tall picture therefore arrives with that button already visible, and this is not a fault: it says that the sheet is longer than the screen and offers to show all of it. A PDF of a single sheet is covered like any picture, though it comes back as a picture and can no longer be saved as a document. A PDF of many pages is not covered, and opening one destroys the copy rather than leaving the older picture behind. Release, in the top row, destroys the copy and empties the screen; the file on the phone is untouched. The screen flashes to the colour of the theme. It is the one button in the app that has to be held rather than tapped, for six tenths of a second, and it fills as it charges so that you can see how much is left and that your finger may still be lifted. Let go early and nothing happens; slide off the button and nothing happens either. It alone is guarded because it alone destroys work rather than a setting — resetting the settings stays an ordinary tap, since guarding everything equally would teach you to hold everything and would therefore guard nothing.'],
    ['Back', 'Three words do three things and never trade places. Undo takes back what you did, and it is the curved arrow in the command bar; it also drops a lasso you were still setting. More opens the drawer of screens and is drawn as four dots — there is no home to go to, because the dispatcher is a drawer rather than a place. Close leaves a screen laid over your work, settings or this reference, and returns to what was under it; it is the cross. Reset returns values to nothing and stays on the four places it already lived. A fourth word, cancel, used to sit on two of these jobs at once and is gone. The system back key closes one screen at a time and only then hides the application; the photograph stays in memory. The step back in the top row returns the work, and when it returns something that changes the size of the sheet — a crop or a change of geometry — it also returns the view you had at the time, since the old magnification belonged to a sheet that no longer exists. Undoing a stroke or a caption leaves your view alone: the sheet has not moved, and where you look at it from is your business.']
